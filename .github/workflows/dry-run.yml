name: build (dry run)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create Cache Directory
        run: mkdir -p ~/cache

      - name: Cache Directory
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/cache
          key: cache-${{ runner.os }}

      - name: Pull Docker Image
        if: steps.cache.outputs.cache-hit != 'true'
        # Pinned 2026-09-26 to the digest the "latest"/"debian" tags resolved to at pin
        # time; refreshed manually (Dependabot's docker ecosystem does not track
        # `docker pull` inside run: steps).
        run: |
          docker pull paperist/texlive-ja:debian@sha256:cc82e975855b858b699be1e037343ff158875c2bc50aa898864edeb1f95f7276
          docker tag paperist/texlive-ja:debian@sha256:cc82e975855b858b699be1e037343ff158875c2bc50aa898864edeb1f95f7276 paperist/texlive-ja:latest
          docker save -o ~/cache/texlive.tar paperist/texlive-ja:latest

      - name: Load Docker Image
        if: steps.cache.outputs.cache-hit == 'true'
        run: docker load -i ~/cache/texlive.tar

      - name: Build LaTeX
        run: make build

      - name: Check Artifacts
        run: |
          # Check if the PDF file exists
          if [ ! -e ./build/sample.pdf ]; then
            echo "No PDF file found in the ./build directory."
            exit 1
          fi
